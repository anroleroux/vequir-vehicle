name: cad

# Builds the model vehicles and publishes its product page: the catalogue site at
# anroleroux.co.za/vequir-vehicle (the user site's custom domain covers it).
#
# The library it uses (vequir-standard, which also carries the CAD tool,
# under tools/cad/) is cloned beside this checkout, where libraries.txt
# expects it: the branch of the same name when it exists there, else the
# default branch.  So a change spanning several vequir repos can be pushed to
# one branch name in each.

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
    inputs:
      design:
        description: 'a part directory holding description.md, e.g. products/MV1/chassis/beam, to generate with Claude'
        required: false
        default: ''

permissions:
  contents: read

# a newer push to the same branch supersedes a running build
concurrency:
  group: cad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests, every committed part and assembly script, and the site: no model, no API key.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # CadQuery's OpenCascade (OCP) and VTK wheels link against these even headless
      - name: Install system libraries for CadQuery
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Fetch the library this one uses (vequir-standard, with the CAD tool)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          for repo in vequir-standard; do
            url="https://github.com/anroleroux/$repo.git"
            git clone -q --depth 1 --branch "$BRANCH" "$url" "../$repo" 2>/dev/null \
              || git clone -q --depth 1 "$url" "../$repo"
            echo "$repo: $(git -C "../$repo" rev-parse --abbrev-ref HEAD) $(git -C "../$repo" rev-parse --short HEAD)"
          done

      - name: Install the CAD tool
        run: python -m pip install --upgrade pip && python -m pip install -e "../vequir-standard/tools/cad[dev]"

      - name: Run tests
        run: python -m pytest -q tests

      # every part and assembly here; a part that fails to build fails the job
      - name: Build the parts and the site
        run: cad site --out results --site site

      - name: Upload the parts
        uses: actions/upload-artifact@v4
        with:
          name: parts
          path: results
          if-no-files-found: error

      - name: Upload the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # one deployment at a time; let a running one finish
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # NL -> script -> CAD with Claude, on demand: Actions -> cad -> Run workflow,
  # naming a part directory.  Needs the ANTHROPIC_API_KEY repository secret.
  generate:
    if: github.event_name == 'workflow_dispatch' && inputs.design != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system libraries for CadQuery
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install the CAD tool
        run: python -m pip install --upgrade pip && python -m pip install "git+https://github.com/anroleroux/vequir-standard.git#subdirectory=tools/cad"

      - name: Generate the part
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESIGN: ${{ inputs.design }}
        run: cad generate --description "$DESIGN/description.md" --out "results/$DESIGN"

      - name: Upload the generated part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-part
          path: results
          if-no-files-found: warn
